boolean nonObfuscatedMc = rootProject.isNonObfuscatedMc.call(project.minecraft_version)

def loomPlugin = nonObfuscatedMc ? libs.plugins.fabric.loom.noremap : libs.plugins.fabric.loom.remap
pluginManager.apply(loomPlugin.get().pluginId)

pluginManager.apply(libs.plugins.preprocessor.get().pluginId)
pluginManager.apply(libs.plugins.yamlang.get().pluginId)
pluginManager.apply(libs.plugins.replace.token.get().pluginId)

repositories {
    maven {
        name = "CottonMC"
        url = "https://staging.alexiil.uk/maven"
        content { includeGroup("io.github.cottonmc") }
    }

    maven {
        name = "Modrinth Maven"
        url = "https://api.modrinth.com/maven"
        content { includeGroup("maven.modrinth") }
    }

    maven {
        name = "Nyan Maven"
        url = "https://maven.hendrixshen.moe/releases"
    }

    mavenCentral()
    mavenLocal()
}

Closure<Dependency> modApi = { Object notation -> dependencies.add(nonObfuscatedMc ? "api" : "modApi", notation) }

dependencies {
    // Development environment
    minecraft("com.mojang:minecraft:${project.minecraft_version}")
    if (!nonObfuscatedMc) {
        mappings(loom.officialMojangMappings())
    }
    modApi(libs.fabric.loader)

    // Annotation processor
    modApi(libs.lombok)
    annotationProcessor(libs.lombok)

    // Dependencies
    modApi("net.fabricmc.fabric-api:fabric-api:${project.fabric_version}")
    modApi("io.github.cottonmc:LibGui:${project.libgui_version}")
    modApi("maven.modrinth:modmenu:${project.modmenu_version}")
}

tasks.named("runClient") {
    doFirst {
        layout.projectDirectory.file("run/client/options.txt").asFile.with { File file ->
            if (!file.exists()) {
                file.parentFile.mkdirs()
                file.withWriter { BufferedWriter writer ->
                    writer.writeLine("autoJump:false")
                    writer.writeLine("enableVsync:false")
                    writer.writeLine("forceUnicodeFont:true")
                    writer.writeLine("fov:1.0")
                    writer.writeLine("gamma:1.0")
                    writer.writeLine("guiScale:3")
                    writer.writeLine("lang:${Locale.getDefault().toString()}")
                    writer.writeLine("maxFps:260")
                    writer.writeLine("renderDistance:10")
                    writer.writeLine("soundCategory_master:0.0")
                }
            }
            null // We don't need to return anything.
        }
    }
}

loom {
    runConfigs.configureEach {
        systemProperties.putAll(Map.of(
                "mixin.debug.export", "true" // Dump modified classes automatically.
        ))
    }

    // We need large window.
    runConfigs.client {
        getProgramArguments().addAll(
                "--width", "1920",
                "--height", "1080",
        )
        getRunDirectory().set(project.file("run/client"))
    }

    mixin {
        // suppress "Cannot remap xxx because it does not exists in any of the targets" warning. It does not respect `remap = false` :(
        useLegacyMixinAp = !nonObfuscatedMc
    }
}

base {
    version = project.parent.version
    group = project.maven_group
    archivesName = "${project.archives_base_name}-mc${project.minecraft_out}"
}

replaceToken {
    targetSourceSets.set([sourceSets.main])

    replace("@MOD_ID@", project.mod_id)
    replaceIn("work/msdnicrosoft/commandbuttons/CommandButtonsReference")
}

yamlang {
    targetSourceSets = [sourceSets.main]
    inputDir = 'assets/mgbuttons/lang'
}

processResources {
    filteringCharset = "UTF-8"
    outputs.upToDateWhen { false }

    Map<String, String> tokens = [
            minecraft_dependency : project.minecraft_dependency.toString(),
            minecraft_version_id : project.minecraft_version.replace(".", "_"),
            minecraft_version_out: project.minecraft_out.toString(),
            mod_id               : project.mod_id.toString(),
            mod_name             : project.mod_name.toString(),
            mod_license          : project.mod_license.toString(),
            mod_sources          : project.mod_sources.toString(),
            mod_version          : project.version.toString(),
            keymapping_api_module: nonObfuscatedMc ? "fabric-key-mapping-api-v1" : "fabric-key-binding-api-v1",
    ]
    inputs.properties(tokens)

    filesMatching("fabric.mod.json") {
        expand(tokens)
    }
}

java {
    sourceCompatibility = JavaVersion.toVersion(project.java_version)
    targetCompatibility = JavaVersion.toVersion(project.java_version)

    withSourcesJar()
}

jar {
    from(project.rootProject.file("LICENSE"))
}

tasks.register("cleanRun") {
    doLast {
        // Clean up the run directory.
        layout.projectDirectory.dir("run").asFile.deleteDir()
    }
}
